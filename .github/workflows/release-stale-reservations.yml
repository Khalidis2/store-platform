name: Release stale inventory reservations

on:
  schedule:
    # Every 15 minutes. GitHub Actions schedules are UTC and, like Vercel's
    # Hobby cron, only guaranteed to run *close to* this interval, not exactly.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call sweep endpoint
        run: |
          curl -sf -X GET "https://${{ vars.APP_DOMAIN }}/api/cron/release-stale-reservations" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
